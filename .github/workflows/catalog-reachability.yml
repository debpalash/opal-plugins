name: Catalog reachability

# Re-probes the `reachable` field across catalog/*.json and appends a run entry
# to catalog/SCAN_LOG.md.
#
# The vocabulary defined in catalog/README.md is preserved exactly, and the
# script never writes a value that means "dead". A probe from a GitHub runner
# cannot establish that: refusals, TLS resets and DNS timeouts are precisely
# what these sites do to datacenter IPs. Refusals stay `blocked-from-ci` and
# anything ambiguous becomes `unknown`.
#
# The script also aborts without writing if an implausible share of the run
# comes back unreachable, since that means the runner's network broke rather
# than sixty independent websites dying at once.

on:
  schedule:
    - cron: '47 6 * * 0'    # Sundays 06:47 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Probe and report without committing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-reachability
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Probe catalog sources
        id: scan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python3 .github/scripts/refresh_catalog.py --concurrency 4 --dry-run
          else
            python3 .github/scripts/refresh_catalog.py --concurrency 4
          fi

      - name: Commit
        if: steps.scan.outputs.changed == 'true' && inputs.dry_run != true
        env:
          COUNT: ${{ steps.scan.outputs.change_count }}
          PROBED: ${{ steps.scan.outputs.probed }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- catalog/

          if git diff --cached --quiet; then
            echo "Nothing staged; not committing."
            exit 0
          fi

          {
            printf 'chore(catalog): refresh reachable for %s source(s)\n\n' "$COUNT"
            printf 'Re-probed %s catalog urls from a GitHub runner.\n\n' "$PROBED"
            printf 'reachable is a probe result from a datacenter IP, not a verdict\n'
            printf 'on the site. blocked-from-ci means the probe was refused and\n'
            printf 'unknown means we could not tell -- neither means dead. Entries\n'
            printf 'marked community / confirmed-community record human provenance\n'
            printf 'and are never overwritten by a probe.\n\n'
            printf 'See catalog/SCAN_LOG.md for this run.\n'
            printf 'Automated by .github/workflows/catalog-reachability.yml\n'
          } > /tmp/catalog-commit-msg

          git commit -F /tmp/catalog-commit-msg
          git push

      - name: Report
        if: always()
        env:
          CHANGED: ${{ steps.scan.outputs.changed }}
          COUNT: ${{ steps.scan.outputs.change_count }}
          PROBED: ${{ steps.scan.outputs.probed }}
        run: |
          set -euo pipefail
          {
            echo "### catalog reachability"
            echo ""
            echo "- probed: \`${PROBED:-0}\`"
            echo "- changed: \`${CHANGED:-false}\` (\`${COUNT:-0}\` entries)"
          } >> "$GITHUB_STEP_SUMMARY"
