name: Refresh lists

# Mirrors lists/*.json from https://github.com/anime-and-manga/lists
#
# Split schedule: anime-airing.json carries next-episode timestamps and turns
# over constantly, so it runs daily. The full anime/manga mapping snapshots
# move slowly and are large (manga-full.json alone is ~12 MB), so pulling them
# daily would be pointless churn -- weekly is enough.
#
# The refresh script validates every download before it is allowed to replace
# a tracked file, and fails the job rather than committing a truncated payload
# or an HTML error page. See .github/scripts/refresh_lists.py.

on:
  schedule:
    - cron: '17 4 * * *'    # daily 04:17 UTC -- anime-airing.json only
    - cron: '41 5 * * 1'    # Mondays 05:41 UTC -- every mapping file
  workflow_dispatch:
    inputs:
      scope:
        description: Which files to refresh
        type: choice
        options:
          - airing
          - all
        default: all

permissions:
  contents: write

concurrency:
  group: refresh-lists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Decide scope
        id: scope
        # Values arrive via env, never interpolated into the shell, so a
        # surprising input cannot become a command.
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "17 4 * * *" ]; then
              scope=airing
            else
              scope=all
            fi
          else
            scope="${INPUT_SCOPE:-all}"
          fi
          case "$scope" in
            airing|all) ;;
            *) echo "::error::unexpected scope '$scope'"; exit 1 ;;
          esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Refreshing scope: $scope"

      - name: Fetch and validate upstream lists
        id: refresh
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          python3 .github/scripts/refresh_lists.py --scope "$SCOPE"

      - name: Commit
        if: steps.refresh.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.refresh.outputs.summary }}
          FILES: ${{ steps.refresh.outputs.files }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- lists/

          # Belt and braces: the script says it changed something, but if the
          # index disagrees we exit quietly rather than making an empty commit.
          if git diff --cached --quiet; then
            echo "No staged changes after all; nothing to commit."
            exit 0
          fi

          {
            printf 'chore(lists): sync from anime-and-manga/lists (%s)\n\n' "$SCOPE"
            printf 'Files: %s\n' "$FILES"
            printf '%s\n\n' "$SUMMARY"
            printf 'Upstream: https://github.com/anime-and-manga/lists\n'
            printf 'Each file was checked for HTTP 200, valid JSON, the expected\n'
            printf 'entry schema and a plausible row count before replacing the\n'
            printf 'tracked copy. Automated by .github/workflows/lists-refresh.yml\n'
          } > /tmp/lists-commit-msg

          git commit -F /tmp/lists-commit-msg
          # These three workflows can overlap (a manual dispatch of all of
          # them raced on the very first run and this push was rejected).
          # Rebase-and-retry rather than fail a job that did its work.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::could not push after 3 rebases"
          exit 1

      - name: Report
        if: always()
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          set -euo pipefail
          {
            echo "### lists refresh"
            echo ""
            echo "- changed: \`${CHANGED:-unknown}\`"
            echo "- ${SUMMARY:-no summary (the fetch step did not finish)}"
          } >> "$GITHUB_STEP_SUMMARY"
